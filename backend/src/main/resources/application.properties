spring.datasource.url=jdbc:postgresql://localhost:5432/jorimusic
spring.datasource.username=jorimusic
spring.datasource.password=jorimusic
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
debug=true
spring.flyway.cleanDisabled=false
logging.level.com.jorimusic.backend.security.JwtTokenProvider=TRACE


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

music.storage.path=/app/music